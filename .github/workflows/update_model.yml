name: Daily Model Update

on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *' # 6 fois par jour (toutes les 4h UTC)
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

concurrency:
  group: model-update
  cancel-in-progress: true

jobs:
  update-data-and-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour créer une release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Pipeline
        run: |
          python src/00_download_data.py
          
          # ATP Pipeline
          python src/01_build_dataset.py --circuit atp
          python src/02_feature_engineering.py --circuit atp
          python src/03_train_model.py --circuit atp
          
          # WTA Pipeline
          python src/01_build_dataset.py --circuit wta
          python src/02_feature_engineering.py --circuit wta
          python src/03_train_model.py --circuit wta

      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if release exists and delete it with retries to handle 502/API errors
          if gh release view latest_model > /dev/null 2>&1; then
            echo "Release latest_model exists, attempting to delete..."
            success=false
            for i in {1..5}; do
              if gh release delete latest_model --yes --cleanup-tag; then
                echo "Successfully deleted latest_model release and tag."
                success=true
                break
              fi
              echo "Attempt $i failed. Waiting 5s before retrying..."
              sleep 5
            done
            if [ "$success" = false ]; then
              echo "Error: Failed to delete release latest_model after multiple attempts."
              exit 1
            fi
          fi
          
          # Also try to delete the tag just in case it was left behind
          git push --delete origin latest_model || true
          
          # Short pause to ensure GitHub API is updated before creating the new release
          sleep 2
          
          gh release create latest_model \
            data/processed/player_state_atp.pkl \
            data/processed/xgb_model_atp.json \
            data/processed/ensemble_atp.pkl \
            data/processed/calibrator_atp.pkl \
            data/processed/feature_cols_atp.pkl \
            data/processed/player_state_wta.pkl \
            data/processed/xgb_model_wta.json \
            data/processed/ensemble_wta.pkl \
            data/processed/calibrator_wta.pkl \
            data/processed/feature_cols_wta.pkl \
            data/processed/players_atp.json \
            data/processed/players_wta.json \
            data/processed/tournaments.json \
            --title "Derniers modèles Stacking Ensemble & données" \
            --notes "Mise à jour automatique des modèles Stacking Ensemble (XGBoost + LightGBM + CatBoost + SHAP) ATP & WTA"

