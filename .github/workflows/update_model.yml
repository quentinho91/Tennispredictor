name: Daily Model Update

on:
  schedule:
    - cron: '0 6 * * *' # Tous les jours a 6h00 UTC
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  update-data-and-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour creer une release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn xgboost pandas pyarrow

      - name: Run Data Pipeline
        run: |
          # Télécharge l'ancienne base de données de prédictions si elle existe
          python src/cloud_storage.py || true
          
          python src/00_download_data.py
          python src/01_build_dataset.py
          python src/02_feature_engineering.py
          python src/03_train_model.py
          python src/short_term_rest_features.py
          
          # Sécurité : créer un fichier vide s'il n'existe toujours pas pour éviter le plantage du release
          if [ ! -f data/processed/predictions_db.json ]; then
            echo "{}" > data/processed/predictions_db.json
          fi

      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Creation ou mise a jour de la release "latest_model"
          # On supprime l'ancienne si elle existe
          gh release delete latest_model --yes || true
          git push --delete origin latest_model || true
          
          # On recree une release avec le tag latest_model
          gh release create latest_model \
            data/processed/player_state.pkl \
            data/processed/xgb_model.json \
            data/processed/calibrator.pkl \
            data/processed/feature_cols.pkl \
            data/processed/predictions_db.json \
            --title "Dernieres previsions & modele" \
            --notes "Mise a jour automatique du modele et des donnees"

      - name: Trigger Render Deployment
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl "$RENDER_DEPLOY_HOOK"
