name: Daily Telegram Value Bets Alert

on:
  schedule:
    # 06h30 UTC (08h30 Paris) — après le update_model de 06h00 UTC pour avoir les données fraîches
    - cron: '30 6 * * *'
  workflow_dispatch: # Permet de déclencher l'alerte manuellement avec un bouton sur GitHub

concurrency:
  group: telegram-alert
  cancel-in-progress: true

jobs:
  scan-and-send-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérification des secrets Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ ERREUR : Le secret TELEGRAM_BOT_TOKEN est vide ou absent dans les Settings > Secrets du repo !"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ ERREUR : Le secret TELEGRAM_CHAT_ID est vide ou absent dans les Settings > Secrets du repo !"
            exit 1
          fi
          echo "✅ Secrets Telegram présents (token: ${TELEGRAM_BOT_TOKEN:0:8}..., chat_id: $TELEGRAM_CHAT_ID)"

      - name: Run Scan and Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/telegram_notifier.py
