name: Daily Telegram Value Bets Alert

on:
  schedule:
    # Tous les jours à 08:00 UTC (10:00 heure de Paris / CET)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permet de déclencher l'alerte manuellement avec un bouton sur GitHub

concurrency:
  group: telegram-alert
  cancel-in-progress: true

jobs:
  scan-and-send-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scan and Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/telegram_notifier.py
